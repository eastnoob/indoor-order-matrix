<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"><title>Synthetic holdout calibration by posterior bin</title><desc>Observed computational truth fraction versus mean Bayesian membership posterior; points aggregate nested memberships and are not independent replicates.</desc><line x1="80" y1="350" x2="650" y2="350" stroke="#222" stroke-width="2" /><line x1="80" y1="60" x2="80" y2="350" stroke="#222" stroke-width="2" /><text x="250" y="410" font-size="16">Mean posterior membership</text><text x="15" y="45" font-size="16">Observed truth fraction</text><line x1="80" y1="350" x2="650" y2="60" stroke="#777" stroke-dasharray="7 5" /><circle cx="119.5203029124138" cy="334.0" r="7" fill="#0072B2" /><text x="128.5203029124138" y="326.0" font-size="12">n=145</text><circle cx="317.2443455" cy="267.14285714285717" r="7" fill="#0072B2" /><text x="326.2443455" y="259.14285714285717" font-size="12">n=14</text><circle cx="494.818838253125" cy="150.625" r="7" fill="#0072B2" /><text x="503.818838253125" y="142.625" font-size="12">n=32</text><circle cx="627.9450325755103" cy="89.59183673469386" r="7" fill="#0072B2" /><text x="636.9450325755103" y="81.59183673469386" font-size="12">n=49</text></svg>