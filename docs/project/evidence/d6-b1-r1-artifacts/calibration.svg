<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590"><title>R1 synthetic holdout calibration; each fixture contributes equally</title><desc>Calibration is against synthetic computational truth only. Counts beside points are fixtures with observations in each bin; memberships are nested. All prior and dependence scenarios are displayed.</desc><text x="170" y="28" font-size="18">Seed 61031 — synthetic truth; fixture-weighted calibration (PPC not run)</text><line x1="90" y1="470" x2="870" y2="470" stroke="#222" /><line x1="90" y1="470" x2="90" y2="90" stroke="#222" /><line x1="90" y1="470" x2="870" y2="90" stroke="#777" stroke-dasharray="7 5" /><text x="330" y="525" font-size="14">Mean posterior probability</text><text x="8" y="65" font-size="14">Observed truth fraction</text><circle cx="150.44167263113223" cy="354.1703703703704" r="6" fill="#0072B2" /><text x="157.44167263113223" y="348.1703703703704" font-size="10">n=15f</text><circle cx="360.11942953403377" cy="311.6666666666667" r="6" fill="#0072B2" /><text x="367.11942953403377" y="305.6666666666667" font-size="10">n=8f</text><circle cx="417.523045493049" cy="379.5238095238095" r="6" fill="#0072B2" /><text x="424.523045493049" y="373.5238095238095" font-size="10">n=7f</text><circle cx="689.249415800193" cy="301.1111111111111" r="6" fill="#0072B2" /><text x="696.249415800193" y="295.1111111111111" font-size="10">n=6f</text><circle cx="833.3681214421252" cy="216.66666666666669" r="6" fill="#0072B2" /><text x="840.3681214421252" y="210.66666666666669" font-size="10">n=3f</text><rect x="153.15636763244507" y="353.39259259259256" width="10" height="10" fill="#0072B2" /><text x="165.15636763244507" y="352.39259259259256" font-size="10">n=15f</text><rect x="355.8444091057999" y="289.7777777777778" width="10" height="10" fill="#0072B2" /><text x="367.8444091057999" y="288.7777777777778" font-size="10">n=10f</text><rect x="415.1198315304974" y="374.5238095238095" width="10" height="10" fil