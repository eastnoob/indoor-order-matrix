<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
<rect width="100%" height="100%" fill="white"/>
<text x="12" y="38" font-size="12" font-family="sans-serif">FLOOR_A / FLOOR_B</text>
<line x1="190" y1="34" x2="510" y2="34" stroke="#555" stroke-width="2"/>
<line x1="350" y1="16" x2="350" y2="52" stroke="#d62728" stroke-width="5"/>
<text x="325" y="67" font-size="10" font-family="sans-serif">closed</text>
<circle cx="230" cy="34" r="12" fill="#1f77b4"/><circle cx="470" cy="34" r="12" fill="#ff7f0e"/>
<text x="218" y="38" fill="white" font-size="9" font-family="sans-serif">A</text><text x="458" y="38" fill="white" font-size="9" font-family="sans-serif">B</text>
<text x="530" y="38" font-size="11" font-family="sans-serif">closed wall → blocked</text>
<text x="12" y="106" font-size="12" font-family="sans-serif">FLOOR_A / STACKED</text>
<line x1="190" y1="102" x2="510" y2="102" stroke="#555" stroke-width="2"/>
<line x1="350" y1="84" x2="350" y2="120" stroke="#888" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="230" cy="102" r="12" fill="#1f77b4"/><circle cx="470" cy="102" r="12" fill="#ff7f0e"/>
<text x="218" y="106" fill="white" font-size="9" font-family="sans-serif">A</text><text x="458" y="106" fill="white" font-size="9" font-family="sans-serif">B</text>
<text x="530" y="106" font-size="11" font-family="sans-serif">same XY → Z incompatible</text>
<text x="12" y="174" font-size="12" font-family="sans-serif">WALL_A / WALL_B</text>
<line x1="190" y1="170" x2="510" y2="170" stroke="#555" stroke-width="2"/>
<line x1="350" y1="152" x2="350" y2="188" stroke="#2ca02c" stroke-width="5"/>
<text x="330" y="203" font-size="10" font-family="sans-serif">opening</text>
<circle cx="230" cy="170" r="12" fill="#1f77b4"/><circle cx="470" cy="170" r="12" fill="#ff7f0e"/>
<text x="218" y="174" fill="white" font-size="9" font-family="sans-serif">A</text><text x="458" y="174" fill="white" font-size="9" font-family="sans-serif">B</text>
<text x="530" y="174" font-size="11" font-family="sans-serif">opening → pass</text>
</svg>
