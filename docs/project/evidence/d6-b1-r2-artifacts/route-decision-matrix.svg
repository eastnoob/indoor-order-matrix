<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470"><title>D6 B1-R2 route decision matrix</title><desc>Design comparison only. Route B is not fitted and no selector or winner is chosen.</desc><text x="24" y="28" font-size="18">D6 B1-R2 Bayesian route gate (design evidence)</text><text x="24" y="58" font-size="13" font-weight="bold">Evidence channel</text><text x="300" y="58" font-size="13" font-weight="bold">A diagnostic-only Bayesian</text><text x="720" y="58" font-size="13" font-weight="bold">B richer Bayesian design</text><line x1="20" x2="1100" y1="96" y2="96" stroke="#ddd" /><text x="24" y="84" font-size="12">geometry</text><text x="300" y="84" font-size="12">A: admitted</text><text x="720" y="84" font-size="12">B: joint likelihood design</text><line x1="20" x2="1100" y1="138" y2="138" stroke="#ddd" /><text x="24" y="126" font-size="12">trend/frame</text><text x="300" y="126" font-size="12">A: admitted if valid</text><text x="720" y="126" font-size="12">B: direction likelihood</text><line x1="20" x2="1100" y1="180" y2="180" stroke="#ddd" /><text x="24" y="168" font-size="12">Z/clearance</text><text x="300" y="168" font-size="12">A: admitted if valid</text><text x="720" y="168" font-size="12">B: availability-gated</text><line x1="20" x2="1100" y1="222" y2="222" stroke="#ddd" /><text x="24" y="210" font-size="12">contact/overlap</text><text x="300" y="210" font-size="12">A: admitted if valid</text><text x="720" y="210" font-size="12">B: shared-source dependence</text><line x1="20" x2="1100" y1="264" y2="264" stroke="#ddd" /><text x="24" y="252" font-size="12">normalized gap</text><text x="300" y="252" font-size="12">A: audit-only scale</text><text x="720" y="252" font-size="12">B: continuous likelihood design</text><line x1="20" x2="1100" y1="306" y2="306" stroke="#ddd" /><text x="24" y="294" font-size="12">wall/opening barrier</text><text x="300" y="294" font-size="12">deferred/not_available</text><text x="720" y="294" font-size="12">deferred until validated</text><line x1="20" x2="1100" y1="348" y2="348" stroke="#ddd" /><text x="24" y="336" font-size="12">empty-space role</text><text x="300" y="336" font-size="12">independent role only</text><text x="720" y="336" font-size="12">independent role only</text><line x1="20" x2="1100" y1="390" y2="390" stroke="#ddd" /><text x="24" y="378" font-size="12">CAR/spatial covariance</text><text x="300" y="378" font-size="12">not_identifiable</text><text x="720" y="378" font-size="12">not_identifiable</text><text x="24" y="440" font-size="11">No posterior predictive checks were run: R1 has no jointly fitted generative model.</text></svg>